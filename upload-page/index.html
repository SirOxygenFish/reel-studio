<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Reel Studio">
<title>Reel Studio</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1d1d1b; --muted: #6b6860; --line: #e3dfd6;
    --accent: #1f6feb; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --err: #c62828; --err-bg: #fdecea;
    --bar-bg: #e9e6df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #22221f; --text: #f1efe9; --muted: #a8a49a; --line: #3a3934;
      --accent: #4c8dff; --accent-text: #0b0b0a; --ok: #5cc87a; --ok-bg: #1d3324; --err: #ff7b72; --err-bg: #3a1f1d;
      --bar-bg: #34332e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 18px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  h1 { font-size: 28px; margin: 0; }
  h2 { font-size: 22px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 20px; }
  .big { display: block; width: 100%; border: 0; border-radius: 16px; padding: 22px 16px; font: inherit;
         font-size: 21px; font-weight: 700; text-align: center; cursor: pointer; background: var(--accent); color: var(--accent-text); }
  .big:disabled { opacity: .45; cursor: default; }
  .second { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 16px; font-size: 19px; }
  .howto { flex: none; border: 2px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px;
           padding: 10px 16px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  label.note { display: block; font-weight: 600; margin: 18px 0 6px; }
  textarea { width: 100%; min-height: 84px; font: inherit; padding: 12px; border-radius: 12px;
             border: 1px solid var(--line); background: var(--bg); color: var(--text); resize: vertical; }
  .gap { height: 14px; }
  .file { padding: 12px 0; border-top: 1px solid var(--line); }
  .file:first-child { border-top: 0; }
  .fname { font-weight: 600; overflow-wrap: anywhere; }
  .fmeta { color: var(--muted); font-size: 16px; }
  .bar { height: 14px; background: var(--bar-bg); border-radius: 7px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .file.ok .bar > div { background: var(--ok); }
  .file.err .bar > div { background: var(--err); }
  .status { font-size: 16px; margin-top: 4px; color: var(--muted); }
  .file.ok .status { color: var(--ok); font-weight: 600; }
  .file.err .status { color: var(--err); font-weight: 600; }
  .warn { background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--muted); margin-top: 14px; }
  .done { background: var(--ok-bg); color: var(--ok); border-radius: 16px; padding: 22px 16px; text-align: center;
          font-size: 24px; font-weight: 800; margin-top: 16px; }
  .partial { background: var(--err-bg); color: var(--err); border-radius: 16px; padding: 18px 16px; text-align: center;
             font-size: 19px; font-weight: 700; margin-top: 16px; }
  .ready { display: flex; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .ready:first-child { border-top: 0; }
  .ready .info { flex: 1; min-width: 0; }
  .dl { flex: none; text-decoration: none; background: var(--accent); color: var(--accent-text); font-weight: 700;
        border-radius: 12px; padding: 12px 16px; font-size: 17px; }
  .ready .acts { flex: none; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .dl.second { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 8px 12px; font-size: 15px;
               font-family: inherit; cursor: pointer; text-align: center; }
  #install .hint { color: var(--muted); font-size: 16px; margin: 10px 0 0; }
  .manual summary { cursor: pointer; color: var(--muted); font-size: 16px; padding-top: 14px; }
  .manual ol { margin: 8px 0 0; padding-left: 22px; font-size: 16px; }
  .empty { color: var(--muted); }
  .langs { text-align: center; color: var(--muted); font-size: 16px; }
  .langs button { border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 10px; cursor: pointer; }
  .langs button.on { color: var(--text); font-weight: 700; text-decoration: underline; }
  #howtoBox { position: fixed; inset: 0; background: rgba(0, 0, 0, .86); display: flex; flex-direction: column;
              align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #howtoBox video { width: auto; max-width: 100%; max-height: calc(100vh - 110px); border-radius: 14px; background: #000; }
  #howtoBox .big { max-width: 360px; margin-top: 14px; padding: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title">Send video</h1>
    <button class="howto" id="howto" data-t="howto">How to</button>
  </header>

  <section class="card" id="install" hidden>
    <h2 data-t="installTitle">Once: add SaveReel</h2>
    <p class="hint" data-t="installText" style="margin:0 0 14px">It saves finished videos into Photos.</p>
    <a class="big" id="installBtn" data-t="install" style="text-decoration:none">Install SaveReel</a>
    <p class="hint" data-t="installHint">Safari asks to open it in Shortcuts: tap Open, then Add Shortcut.</p>
    <button class="big second" id="installDone" data-t="installDone" style="margin-top:14px">I added it</button>
  </section>

  <section class="card" id="pick">
    <label class="big" for="files" data-t="choose">Choose videos or photos</label>
    <input type="file" id="files" multiple accept="video/*,image/*">
    <div id="chosen" hidden>
      <div class="gap"></div>
      <div id="chosenList"></div>
      <label class="note" for="note" data-t="noteLabel">What should happen with this video?</label>
      <textarea id="note" data-tp="notePh" placeholder="For example: edit into a Reel"></textarea>
      <div class="gap"></div>
      <button class="big" id="send" data-t="send">Send</button>
    </div>
  </section>

  <section class="card" id="progress" hidden>
    <h2 data-t="uploading">Uploading</h2>
    <div id="progressList"></div>
    <div id="keepOpen" class="warn" data-t="keepOpen">Keep this page open until it finishes</div>
    <div class="done" id="done" hidden data-t="done">Done, uploaded</div>
    <div class="partial" id="partial" hidden data-t="partial">Some files did not upload</div>
    <div class="gap"></div>
    <button class="big" id="retry" hidden data-t="retry">Try again</button>
    <button class="big second" id="again" hidden data-t="again">Send more</button>
  </section>

  <section class="card">
    <h2 data-t="finished">Finished videos</h2>
    <div id="readyList" class="empty"></div>
    <details class="manual" id="manual" hidden><summary data-t="manualTitle">No SaveReel? Save by hand</summary><ol id="manualSteps"></ol></details>
  </section>

  <div class="langs" id="reinstall" hidden><button data-t="install">Install SaveReel</button></div>
  <div class="langs" id="langs"><button data-l="en">English</button>·<button data-l="ru">Русский</button>·<button data-l="pl">Polski</button></div>
</main>

<div id="howtoBox" hidden>
  <video id="howtoVideo" controls playsinline preload="none"></video>
  <button class="big second" id="howtoClose" data-t="close">Close</button>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get('k') || '';
document.head.insertAdjacentHTML('beforeend', `<link rel="apple-touch-icon" href="/icon.png?k=${encodeURIComponent(KEY)}">`);
let picked = [], batch = null, busy = false;

const T = {
  en: { installTitle: 'Once: add SaveReel', installText: 'It saves finished videos into Photos.', install: 'Install SaveReel',
        installHint: 'Safari asks to open it in Shortcuts: tap Open, then Add Shortcut.',
        installDone: 'I added it', savePhotos: 'Save to Photos', preparing: 'Preparing…', tapAgain: 'Ready, tap again',
        manualTitle: 'No SaveReel? Save by hand',
        manual: ['Tap Download next to the video.', 'Tap the download arrow in the Safari address bar, then the video.', 'Tap Share.', 'Tap Save Video.'],
        title: 'Send video', howto: 'How to', choose: 'Choose videos or photos', noteLabel: 'What should happen with this video?',
        notePh: 'For example: edit into a Reel', send: 'Send', uploading: 'Uploading', keepOpen: 'Keep this page open until it finishes',
        done: 'Done, uploaded', partial: 'Some files did not upload', retry: 'Try again', again: 'Send more', finished: 'Finished videos',
        nothing: 'Nothing yet', loadFail: 'Could not load the list', gallery: 'To gallery', download: 'Download', skipped: 'Skipped',
        waiting: 'Waiting', sending: 'Uploading', uploaded: 'Uploaded', failed: 'Failed', lost: 'connection lost', of: 'of',
        noAnswer: 'The computer is not answering', close: 'Close', space: 'not enough space on the computer', types: 'only video and photos' },
  ru: { installTitle: 'Один раз: добавьте SaveReel', installText: 'Она сохраняет готовые видео в «Фото».', install: 'Установить SaveReel',
        installHint: 'Safari предложит открыть файл в «Быстрых командах»: нажмите «Открыть», затем кнопку добавления.',
        installDone: 'Готово, добавлено', savePhotos: 'Сохранить в «Фото»', preparing: 'Готовлю…', tapAgain: 'Готово, нажмите ещё раз',
        manualTitle: 'Без SaveReel: сохранить вручную',
        manual: ['Нажмите «Скачать» у видео.', 'Нажмите стрелку загрузок в адресной строке Safari, затем видео.', 'Нажмите «Поделиться».', 'Нажмите «Сохранить видео».'],
        title: 'Отправить видео', howto: 'Как пользоваться', choose: 'Выбрать видео или фото', noteLabel: 'Что сделать с этим видео?',
        notePh: 'Например: смонтируй рилс', send: 'Отправить', uploading: 'Загрузка', keepOpen: 'Не закрывайте страницу, пока идёт загрузка',
        done: 'Готово, загружено', partial: 'Часть файлов не загрузилась', retry: 'Попробовать снова', again: 'Отправить ещё', finished: 'Готовые видео',
        nothing: 'Пока ничего нет', loadFail: 'Не удалось загрузить список', gallery: 'В галерею', download: 'Скачать', skipped: 'Пропущено',
        waiting: 'Ждёт', sending: 'Загружается', uploaded: 'Загружено', failed: 'Ошибка', lost: 'связь прервалась', of: 'из',
        noAnswer: 'Компьютер не отвечает', close: 'Закрыть', space: 'на компьютере не хватает места', types: 'только видео и фото' },
  pl: { installTitle: 'Jednorazowo: dodaj SaveReel', installText: 'Zapisuje gotowe filmy w Zdjęciach.', install: 'Zainstaluj SaveReel',
        installHint: 'Safari zapyta, czy otworzyć plik w Skrótach: stuknij Otwórz, potem przycisk dodawania.',
        installDone: 'Gotowe, dodane', savePhotos: 'Zapisz w Zdjęciach', preparing: 'Przygotowuję…', tapAgain: 'Gotowe, stuknij jeszcze raz',
        manualTitle: 'Bez SaveReel: zapisz ręcznie',
        manual: ['Stuknij „Pobierz” przy filmie.', 'Stuknij strzałkę pobierania w pasku adresu Safari, potem film.', 'Stuknij Udostępnij.', 'Wybierz zapisanie wideo w Zdjęciach.'],
        title: 'Wyślij wideo', howto: 'Jak to działa', choose: 'Wybierz filmy lub zdjęcia', noteLabel: 'Co zrobić z tym filmem?',
        notePh: 'Na przykład: zmontuj rolkę', send: 'Wyślij', uploading: 'Wysyłanie', keepOpen: 'Nie zamykaj strony, dopóki trwa wysyłanie',
        done: 'Gotowe, wysłane', partial: 'Część plików się nie wysłała', retry: 'Spróbuj ponownie', again: 'Wyślij więcej', finished: 'Gotowe filmy',
        nothing: 'Na razie nic', loadFail: 'Nie udało się wczytać listy', gallery: 'Do galerii', download: 'Pobierz', skipped: 'Pominięto',
        waiting: 'Czeka', sending: 'Wysyłanie', uploaded: 'Wysłano', failed: 'Błąd', lost: 'połączenie przerwane', of: 'z',
        noAnswer: 'Komputer nie odpowiada', close: 'Zamknij', space: 'na komputerze brakuje miejsca', types: 'tylko filmy i zdjęcia' },
};
const SERVER_ERR = { 'not enough space on the computer': 'space', 'only video and photos': 'types' };
function pickLang() {
  try { const s = localStorage.getItem('lang'); if (T[s]) return s; } catch {}
  for (const l of navigator.languages || [navigator.language || 'en']) { const k = String(l).slice(0, 2).toLowerCase(); if (T[k]) return k; }
  return 'en';
}
let LANG = pickLang(), t = T[LANG];
function applyLang(l) {
  LANG = l; t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = t[el.dataset.tp]);
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  $('installBtn').href = shortcutFile();
  $('manualSteps').innerHTML = t.manual.map(x => `<li>${esc(x)}</li>`).join('');
  loadReady();
}
document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => {
  try { localStorage.setItem('lang', b.dataset.l); } catch {}
  applyLang(b.dataset.l);
}));

function size(b) {
  const gb = b / 1024 ** 3, mb = b / 1024 ** 2;
  const fmt = (x, d) => x.toFixed(d).replace(',', '.');
  return gb >= 1 ? fmt(gb, 1) + ' GB' : mb >= 1 ? fmt(mb, mb < 10 ? 1 : 0) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const okType = f => /^(video|image)\//.test(f.type) ||
  /\.(mov|mp4|m4v|3gp|3g2|avi|mkv|webm|hevc|mts|m2ts|jpe?g|png|heic|heif|webp|gif|bmp|tiff?|dng)$/i.test(f.name);

$('files').addEventListener('change', e => {
  const all = [...e.target.files];
  picked = all.filter(okType);
  const skipped = all.length - picked.length;
  $('chosenList').innerHTML = picked.map(f =>
    `<div class="file"><div class="fname">${esc(f.name)}</div><div class="fmeta">${size(f.size)}</div></div>`).join('') +
    (skipped ? `<div class="status" style="color:var(--err)">${t.skipped}: ${skipped}</div>` : '');
  $('chosen').hidden = picked.length === 0 && !skipped;
  $('send').disabled = picked.length === 0;
});

$('send').addEventListener('click', async () => {
  if (!picked.length || busy) return;
  busy = true;
  $('send').disabled = true;
  try {
    const r = await fetch('/api/batch?k=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify({ note: $('note').value }) });
    if (!r.ok) throw new Error();
    batch = (await r.json()).batch;
  } catch {
    busy = false; $('send').disabled = false;
    alert(t.noAnswer);
    return;
  }
  $('pick').hidden = true;
  $('progress').hidden = false;
  $('progressList').innerHTML = picked.map((f, i) => `
    <div class="file" id="f${i}">
      <div class="fname">${esc(f.name)}</div>
      <div class="bar"><div></div></div>
      <div class="status">${t.waiting} · ${size(f.size)}</div>
    </div>`).join('');
  picked.forEach(f => f.state = 'wait');
  await runQueue();
});

function uploadOne(f, i) {
  return new Promise(resolve => {
    const row = $('f' + i), bar = row.querySelector('.bar > div'), st = row.querySelector('.status');
    row.className = 'file';
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?k=${KEY}&batch=${encodeURIComponent(batch)}&name=${encodeURIComponent(f.name)}`);
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total * 100;
      bar.style.width = p.toFixed(1) + '%';
      st.textContent = `${Math.floor(p)}% · ${size(e.loaded)} ${t.of} ${size(e.total)}`;
    };
    xhr.onload = () => {
      if (xhr.status === 201) {
        bar.style.width = '100%'; row.className = 'file ok'; st.textContent = t.uploaded + ' · ' + size(f.size); f.state = 'ok';
      } else {
        let msg = t.failed;
        try { const m = JSON.parse(xhr.responseText).error; msg = t[SERVER_ERR[m]] || m || msg; } catch {}
        row.className = 'file err'; st.textContent = t.failed + ': ' + msg; f.state = 'err';
      }
      resolve();
    };
    xhr.onerror = xhr.ontimeout = () => {
      row.className = 'file err'; st.textContent = t.failed + ': ' + t.lost; f.state = 'err'; resolve();
    };
    st.textContent = t.sending + ' · ' + size(f.size);
    xhr.send(f);
  });
}

async function runQueue() {
  busy = true;
  ['done', 'partial', 'retry', 'again'].forEach(id => $(id).hidden = true);
  $('keepOpen').hidden = false;
  for (let i = 0; i < picked.length; i++) {
    if (picked[i].state !== 'ok') await uploadOne(picked[i], i);
  }
  busy = false;
  $('keepOpen').hidden = true;
  const failed = picked.filter(f => f.state !== 'ok').length;
  $('done').hidden = failed > 0;
  $('partial').hidden = failed === 0;
  $('retry').hidden = failed === 0;
  $('again').hidden = false;
  loadReady();
}

$('retry').addEventListener('click', () => { if (!busy) runQueue(); });
$('again').addEventListener('click', () => location.reload());
window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });

// "How to": the bundled iPhone tutorial in the page's language, served by this computer (works without internet)
$('howto').addEventListener('click', () => {
  const v = $('howtoVideo');
  v.src = `/howto/${LANG}.mp4?k=${KEY}`;
  $('howtoBox').hidden = false;
  v.play().catch(() => {});
});
$('howtoClose').addEventListener('click', () => { const v = $('howtoVideo'); v.pause(); v.removeAttribute('src'); v.load(); $('howtoBox').hidden = true; });

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// iOS Shortcut "SaveReel": Get Contents of URL, then Save to Photo Album. Address is plain ASCII: /v/<id>.<ext>
const galleryLink = f => 'shortcuts://run-shortcut?name=SaveReel&input=text&text=' +
  encodeURIComponent(location.origin + '/v/' + f.id + f.ext + '?k=' + KEY);

// The signed SaveReel file in the page's language (its alert speaks it). A plain link: Safari offers "Open in Shortcuts".
// (shortcuts://import-shortcut was tried on iOS 18: "The shortcut URL was invalid".)
const shortcutFile = () => `${location.origin}/shortcut/${LANG}/SaveReel.shortcut?k=${encodeURIComponent(KEY)}`;
function showInstall(on) {
  $('install').hidden = !on; $('reinstall').hidden = on;
  try { localStorage.setItem('savereel', on ? '' : 'added'); } catch {}
}
if (isIOS) {
  let added = false;
  try { added = localStorage.getItem('savereel') === 'added'; } catch {}
  showInstall(!added); $('manual').hidden = false;
}
$('installDone').addEventListener('click', () => showInstall(false));
$('reinstall').querySelector('button').addEventListener('click', () => { showInstall(true); $('install').scrollIntoView({ behavior: 'smooth' }); });

// Without SaveReel: over HTTPS (for example Tailscale) the share sheet can save the video to Photos; otherwise a plain download.
const canShare = window.isSecureContext && !!navigator.canShare;
const fileURL = f => `/download?k=${KEY}&f=${encodeURIComponent(f.name)}`;
const shared = {};
async function shareVideo(btn, f) {
  try {
    if (!shared[f.name]) {                      // Safari wants share() straight from a tap: fetch first, then ask for a second tap
      btn.textContent = t.preparing;
      const b = await (await fetch(fileURL(f))).blob();
      shared[f.name] = new File([b], f.name, { type: b.type || 'video/mp4' });
      btn.textContent = t.tapAgain;
      return;
    }
    await navigator.share({ files: [shared[f.name]] });
    btn.textContent = t.savePhotos;
  } catch (e) {
    btn.textContent = e && e.name === 'AbortError' ? t.savePhotos : t.tapAgain;
  }
}

async function loadReady() {
  const box = $('readyList');
  try {
    const r = await fetch('/api/ready?k=' + KEY, { cache: 'no-store' });
    const files = (await r.json()).files;
    if (!files.length) { box.className = 'empty'; box.textContent = t.nothing; return; }
    box.className = '';
    box.innerHTML = files.map(f => `
      <div class="ready">
        <div class="info">
          <div class="fname">${esc(f.title)}</div>
          <div class="fmeta">${new Date(f.mtime * 1000).toLocaleString(LANG, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })} · ${size(f.size)}</div>
        </div>
        ${isIOS ? `<div class="acts"><a class="dl" href="${galleryLink(f)}">${t.gallery}</a>${canShare
                    ? `<button class="dl second" data-share="${esc(f.name)}">${t.savePhotos}</button>`
                    : `<a class="dl second" href="${fileURL(f)}" download>${t.download}</a>`}</div>`
                : `<a class="dl" href="${fileURL(f)}" download>${t.download}</a>`}
      </div>`).join('');
    box.querySelectorAll('[data-share]').forEach(b => b.addEventListener('click', () => shareVideo(b, files.find(x => x.name === b.dataset.share))));
  } catch {
    box.className = 'empty'; box.textContent = t.loadFail;
  }
}
applyLang(LANG);
</script>
</body>
</html>
